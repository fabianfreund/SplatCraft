appId: dev.splatcraft.app
productName: SplatCraft
copyright: Copyright © 2026 SplatCraft contributors
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
  # Window/dock icon, referenced by the main bundle as ../../resources/*.png
  - resources/icon.png
  - resources/icon-mac.png
  - "!**/*.map"
  - "!src/**"
  - "!**/{tsconfig*.json,electron.vite.config.*,electron-builder.yml}"
# Native module: keep its .node binaries and libvips outside the asar.
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
# Bundled native tools (ffmpeg, colmap, brush …) → <resources>/tools, see Toolchain.bundledDir.
extraResources:
  - from: resources/tools
    to: tools
    filter:
      - "**/*"
      - "!.gitkeep"
fileAssociations:
  - ext: splatcraft
    name: SplatCraft Project
    role: Editor
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: true
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing identity comes from CSC_NAME (see scripts/release-mac.sh).
  # Notarization runs when APPLE_KEYCHAIN_PROFILE or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID is set.
  notarize: true
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
linux:
  category: Graphics
  maintainer: SplatCraft contributors
  target:
    - AppImage
    - deb
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
